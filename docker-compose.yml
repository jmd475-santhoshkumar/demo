# ResourceIQ -- full stack for a single EC2 host
# Postgres + FastAPI + Next.js
#
# Current architecture:
#
#   Internet
#       |
#       v
#   ALB :80
#       |
#       v
#   EC2 :80
#       |
#       v
#   Frontend container :3000
#       |
#       | /api/* via Next.js rewrite
#       v
#   Backend container :8000
#       |
#       v
#   PostgreSQL :5432
#
# PostgreSQL is not exposed outside Docker.
# Backend port 8000 is exposed on the EC2 for debugging.
# Frontend is exposed on EC2 port 80.

services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

    # PostgreSQL is NOT exposed on the EC2 host.
    # Only the backend container connects to PostgreSQL.
    
    ports:
      - "5432:5432"

    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ──────────────────────────────────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      # EC2:8000 -> Container:8000
      #
      # This is optional for debugging.
      # You don't need ALB traffic to use this port.
      - "8000:8000"

    environment:

      # ── Database ──────────────────────────────────────────────────────────

      # IMPORTANT:
      # "postgres" is the Docker Compose service name.
      # Do NOT use localhost here.

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}


      # ── CORS / Frontend ──────────────────────────────────────────────────

      # Current public application URL is the ALB.

      CORS_ORIGINS: ${CORS_ORIGINS:-http://alb-resouce-iq-949735300.ap-south-2.elb.amazonaws.com}

      FRONTEND_URL: ${FRONTEND_URL:-http://alb-resouce-iq-949735300.ap-south-2.elb.amazonaws.com}


      # ── Data source ──────────────────────────────────────────────────────

      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-local}
      JIN_API_BASE_URL: ${JIN_API_BASE_URL:-}
      JIN_API_KEY: ${JIN_API_KEY:-}


      # ── Email / Digest ───────────────────────────────────────────────────

      MAILTRAP_HOST: ${MAILTRAP_HOST:-}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:-}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:-}
      MAILTRAP_FROM_EMAIL: ${MAILTRAP_FROM_EMAIL:-resourceiq@jmangroup.com}
      MAILTRAP_FROM_NAME: ${MAILTRAP_FROM_NAME:-ResourceIQ}
      DIGEST_RECIPIENT_EMAIL: ${DIGEST_RECIPIENT_EMAIL:-}


      # ── Vector Store ─────────────────────────────────────────────────────

      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_HOST: ${PINECONE_HOST:-}


      # ── Azure DevOps ────────────────────────────────────────────────────

      AZURE_DEVOPS_ORG: ${AZURE_DEVOPS_ORG:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_TEAM: ${AZURE_DEVOPS_TEAM:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}


      # ── LLM Providers ────────────────────────────────────────────────────

      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-gpt-4o}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}


      # ── Entra ID SSO ─────────────────────────────────────────────────────

      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}

      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}


      # ── S3 ───────────────────────────────────────────────────────────────

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-}


      # ── Offline ML models ────────────────────────────────────────────────

      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"


    volumes:

      # Application state
      - resourceiq_appstate:/app/backend/data/AppState

      # Embedding cache
      - resourceiq_embedding_cache:/app/backend/.embedding_cache


    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ──────────────────────────────────────────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────────────────────────────────────────

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

      # IMPORTANT:
      # Only ONE args block.
      #
      # BACKEND_URL is required during the Next.js build because
      # next.config.js rewrites() is evaluated during npm run build.

      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}


    restart: unless-stopped


    depends_on:
      backend:
        condition: service_healthy


    ports:
      # EC2 port 80
      #        ↓
      # Frontend container port 3000
      #
      # ALB sends HTTP:80 to EC2:80.

      - "3000:3000"


    environment:

      # Runtime backend service name inside Docker network.
      BACKEND_URL: http://backend:8000

      NODE_ENV: production

      PORT: "3000"

      HOSTNAME: "0.0.0.0"


    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


# ────────────────────────────────────────────────────────────────────────────
# Named volumes
# ────────────────────────────────────────────────────────────────────────────

volumes:

  resourceiq_appstate:

  resourceiq_embedding_cache:
