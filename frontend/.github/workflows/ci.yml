name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: resourceiq-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
